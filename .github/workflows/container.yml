# Container image: packs the binaries the Release workflow just published.
# Called by the dist-generated release.yml via `post-announce-jobs`.
# No compile, no rebuild — downloads the dist tarballs from the GitHub release.
name: Container

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            target: x86_64-unknown-linux-gnu
            digest-suffix: amd64
          - platform: linux/arm64
            target: aarch64-unknown-linux-gnu
            digest-suffix: arm64
    steps:
      # The Dockerfile lives in the repository, not in the release tarball, so
      # the job needs a checkout to hand it to buildx with --file.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve tag
        run: echo "TAG=${{ fromJson(inputs.plan).announcement_tag }}" >> "$GITHUB_ENV"

      - name: Download release binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir ctx
          asset="arkham-${{ matrix.target }}.tar.xz"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p "$asset" -O bundle.tar.xz
          # dist nests the contents under a root dir named after the archive.
          tar xJf bundle.tar.xz -C ctx --strip-components=1
          test -x ctx/arkham

      - name: Assert the binary carries transparent capture
        run: |
          # dist silently ignores build settings it does not recognize, and a
          # binary built without capture only fails at runtime, in production.
          # Each marker is a static string that only exists when its backend is
          # compiled in: the TUN device path (arkham-tun), the unscoped-capture
          # guard message (arkham-tproxy), and the eBPF program name inside the
          # embedded BPF object (arkham-ebpf-programs). The per-backend failure
          # messages are runtime format strings ("{name} capture failed: ..."),
          # so they never appear verbatim in the binary.
          for marker in '/dev/net/tun' 'refusing to install unscoped TPROXY capture' 'capture_egress'; do
            if ! grep -aq -- "$marker" ctx/arkham; then
              echo "::error::ctx/arkham was built without transparent capture ($marker)"
              exit 1
            fi
          done

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ctx
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,push=true

      - name: Export digest
        run: |
          mkdir -p digests
          digest="${{ steps.build.outputs.digest }}"
          touch "digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.digest-suffix }}
          path: digests/*
          if-no-files-found: error

  merge:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        run: echo "TAG=${{ fromJson(inputs.plan).announcement_tag }}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: digests
        run: |
          ver="${TAG#v}"
          srcs="$(printf "${{ env.IMAGE }}@sha256:%s " *)"
          args=(-t "$IMAGE:$ver")
          case "$ver" in
            *-*) ;; # prerelease: no latest
            *) args+=(-t "$IMAGE:latest") ;;
          esac
          # shellcheck disable=SC2086 # word-split is the point: one arg per digest
          docker buildx imagetools create "${args[@]}" $srcs

      - name: Inspect image
        run: docker buildx imagetools inspect "${IMAGE}:${TAG#v}"
