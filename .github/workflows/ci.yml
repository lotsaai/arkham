name: CI

on:
  pull_request:
  push:
    branches: [main, master]

# mise reads `mise.<env>.toml` alongside `mise.toml`, so this is what selects
# mise.ci.toml. Workflow-level so mise-action's `mise install --locked` and
# every `run:` step see the same environment.
env:
  MISE_ENV: ci

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # nftables and bpftool are for the k3s task's failure dump
      # (`nft list ruleset`, `bpftool cgroup tree`), not for the build.
      # linux-tools-generic is that bpftool package. Its metapackage sometimes
      # publishes before the concrete kernel package is on the runner mirror,
      # and a single install transaction then installs nothing. The build
      # packages stay required. bpftool is installed when the mirror can.
      - name: Install system deps
        run: |-
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev zstd mold nftables linux-tools-common bubblewrap
          if ! sudo apt-get install -y --no-install-recommends linux-tools-generic; then
            echo "linux-tools-generic is not installable on this mirror"
          fi

      # Pinned by hand to the LLVM major the pinned rustc ships. rustc is
      # NOT installed yet when this step runs, so probing `rustc -Vv` here
      # reads the runner's stale preinstall and installs the wrong clang.
      # Bump this together with the `linker` in `.cargo/config.toml` and
      # the rustc version, a few times a year.
      - name: Install clang 23 (rustc 1.99 = LLVM 23)
        run: |-
          set -euxo pipefail
          curl -sSL https://apt.llvm.org/llvm.sh | sudo bash -s -- 23
          sudo apt-get install -y --no-install-recommends clang-23

      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true

      # With the pinned rustc now on PATH, assert it still ships the LLVM
      # major the clang pin above and `.cargo/config.toml`'s `linker` were
      # written for. A rust bump that skips the pin fails here, loudly,
      # instead of as a missing-linker error halfway through a build.
      - name: Verify the clang pin matches rustc's LLVM major
        run: |-
          set -euxo pipefail
          llvm_major="$(rustc -vV | awk -F': ' '/^LLVM version:/ {sub(/\..*/, "", $2); print $2}')"
          if [ "$llvm_major" != 23 ]; then
            echo "rustc reports LLVM ${llvm_major} but the pinned clang is 23." >&2
            echo "Bump the clang pin in this workflow and the linker in .cargo/config.toml." >&2
            exit 1
          fi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Lint
        run: mise check

      - name: Buld & Test
        run: |-
          set -euxo pipefail
          # Ubuntu 24.04 denies unprivileged user namespaces unless this is
          # off or an AppArmor profile grants them. Bubblewrap needs one for
          # --unshare-pid. Leave a loaded bwrap profile in place.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          # The daemon creates arkham-host under this process's cgroup.
          # GitHub-hosted runners own that directory as root, so mkdir
          # returns EACCES. A child cgroup owned by the job user is enough.
          rel="$(awk -F: '$1 == 0 { print $3 }' /proc/self/cgroup)"
          base="/sys/fs/cgroup${rel}"
          if ! mkdir "${base}/arkham-ci-probe" 2>/dev/null; then
            delegate="${base}/arkham-ci"
            sudo mkdir -p "$delegate"
            echo $$ | sudo tee "$delegate/cgroup.procs" >/dev/null
            sudo chown -R "$(id -u):$(id -g)" "$delegate"
            base="$delegate"
          else
            rmdir "${base}/arkham-ci-probe"
          fi
          probe="${base}/arkham-ci-probe"
          mkdir "$probe"
          echo $$ > "$probe/cgroup.procs"
          echo $$ > "$base/cgroup.procs"
          rmdir "$probe"
          timeout 20 bwrap --unshare-user --unshare-pid --die-with-parent --bind / / --dev /dev --proc /proc -- true
          mise build

      # test:ssh tears the stack down before this step runs, after writing
      # /tmp/arkham-integration-compose.log. The live `compose logs` call
      # covers a failure that left containers behind.
      - name: Dump integration compose logs
        if: failure()
        run: |-
          set +e
          if [ -f /tmp/arkham-integration-compose.log ]; then
            cat /tmp/arkham-integration-compose.log
          fi
          if [ -f integration/.env ]; then
            docker compose -f integration/compose.yaml --env-file integration/.env logs --no-color
          else
            docker compose -f integration/compose.yaml logs --no-color
          fi

  # macOS has no compose stack, no capture backends and no integration
  # services, so this job checks that the workspace builds, lints clean and
  # passes the Rust tests there. Lint (hk) runs on Linux only; the platform
  # specific part it would add here is clippy. arkham-ebpf, arkham-tproxy and
  # arkham-tun are Linux capture backends (netlink, eBPF, TUN) and are only
  # Linux dependencies of the binary, so they are excluded here.
  macos:
    runs-on: macos-latest
    env:
      # mise.ci.toml hard-codes the Linux runner's checkout path, so it can't
      # apply here. mise.toml's relative cargo and rustup homes do.
      MISE_ENV: ""
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          experimental: true
          install: true
          cache: true

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin

      - name: Clippy
        run: cargo clippy --locked --workspace --exclude arkham-ebpf-programs --exclude arkham-ebpf --exclude arkham-tproxy --exclude arkham-tun --all-targets -- -D warnings

      - name: Test
        run: |-
          set -euo pipefail
          mise run build:plugins
          ARKHAM_PLUGIN_FIXTURES="$PWD/target/plugins" cargo nextest run --locked --cargo-quiet --workspace --exclude arkham-ebpf-programs --exclude arkham-ebpf --exclude arkham-tproxy --exclude arkham-tun --status-level=slow
