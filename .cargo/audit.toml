# cargo-audit gate policy. Vulnerabilities fail `mise run format`; entries
# below are accepted debt, each with the blocker that keeps it pinned. Delete
# an entry the moment its blocker moves.
[advisories]
ignore = [
  # aws-smithy-http-client 1.5.0 (the whole aws-sdk chain under fnox-core
  # and the compose SSM/KMS leg) requires h2 0.3; >=0.4.16 is semver-
  # incompatible. Unblock when the aws-sdk releases on h2 0.4.
  "RUSTSEC-2026-0258",

  # russh is pinned to 0.56.x for the rama-quic/fnox-core conflict; 0.56
  # pulls libcrux 0.0.4. Unblock with russh >=0.60.3.
  "RUSTSEC-2026-0154",
  "RUSTSEC-2026-0153",
  "RUSTSEC-2026-0212",
  "RUSTSEC-2026-0208",
  "RUSTSEC-2026-0207",
  "RUSTSEC-2026-0074",

  # rustls-webpki 0.101 rides rustls 0.21 under hyper-rustls 0.24 in the
  # aws-sdk egress leg; fixes land in webpki 0.103. Unblock when
  # aws-smithy-http-client drops the hyper 0.14 stack.
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  "RUSTSEC-2026-0104",

  # rustls 0.21.12 under hyper-rustls 0.24 (aws-smithy-http-client) has
  # no backport. Direct rustls is locked at >=0.23.46, so these match only
  # that 0.21 copy. -0346 needs a custom ClientSessionStore that
  # Debug-formats session values; the aws-sdk client does not. -0349 is a
  # post-quantum hybrid downgrade, and rustls 0.21 has no hybrid key share
  # to downgrade. Unblock when aws-smithy-http-client drops the hyper 0.14
  # stack.
  "RUSTSEC-2026-0346",
  "RUSTSEC-2026-0349",

  # webpki-roots 0.26.11 is a semver shim that re-exports webpki-roots 1.x,
  # and Cargo.lock resolves that to 1.0.10, which already removes the
  # distrusted emSign ECC Root CA - G3. Only the shim's version number
  # matches; no distrusted root ships. Delete if the shim stops resolving
  # to >=1.0.10.
  "RUSTSEC-2026-0381",

  # rustls-webpki 0.101.7 has no 0.101 backport of the emSign intermediate
  # distrust. It rides rustls 0.21 in aws-smithy-http-client's
  # legacy-rustls-ring client under fnox-core, which trusts the OS root
  # store via rustls-native-certs, not a bundled one, and is used only for
  # AWS SDK calls. Direct rustls uses rustls-webpki >=0.103.16. Unblock
  # when fnox-core stops enabling the aws-sdk legacy rustls default.
  "RUSTSEC-2026-0382",

  # Marvinattack on rsa; no fixed release exists upstream, both locked
  # versions are affected. Revisit when a fix ships.
  "RUSTSEC-2023-0071",
]
