[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The release build must not run `cargo build --workspace`: workspace member
# `arkham-ebpf-programs` only compiles for the `bpf` target (see hk.pkl), so a
# host `--workspace` build dies on the panic handler.
#
# cargo has no per-member exclusion for `--workspace` (mise-style `--exclude`
# is a cargo CLI flag dist never passes; `default-members` is ignored by
# `--workspace`), and cargo-dist offers no exclude list either — its whole
# cargo-build config surface is this `precise-builds` switch: "Build only the
# required packages, and individually". Kicking the crate out of the cargo
# workspace is not an option either: aya-build resolves it from the workspace
# root with `cargo build --package arkham-ebpf-programs`, which cannot match a
# non-member. So this is the one supported way to keep the bpf-only crate out
# of host builds; `dist = false` in that crate's manifest covers selection.
precise-builds = true
# aws-lc-sys needs cmake to build its C sources.
github-build-setup = "../build-setup.yml"
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
# Binaries built here are what the container image packs: no second compile.
targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# eBPF capture is compiled in unconditionally on Linux.
# Container image build, inlined into the release pipeline (no separate trigger):
# downloads the dist tarballs from the GitHub release this run just published.
post-announce-jobs = ["./container"]
# The container workflow pushes to GHCR, which the default `contents: write`
# block does not allow. Grant it explicitly.
github-custom-job-permissions = { "container" = { "contents" = "read", "packages" = "write" } }
