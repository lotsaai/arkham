name: arkham-integration

# Transparent capture topology: the client container shares arkham's network
# namespace (network_mode: service:arkham). arkham runs --proxy-backend tproxy and installs its
# policy routing inside that shared netns, so every client connection is
# captured without any proxy configuration on the client — LAN included.
# arkham's marked upstream dials bypass the capture (fwmark rule).
#
# tproxy, not ebpf: the eBPF backend captures by cgroup membership, and a
# compose service's cgroup path is not something this file can pin. Use
# `ARKHAM_BACKEND=ebpf mise run demo:bwrap` for the same scenarios over eBPF.

# One value for smtp-direct and the client. Unset keeps the demo decoy.
# An empty value skips the direct dial and the client SMTP scenario.
x-smtp-url: &smtp-url "${SMTP_URL-smtp://agent%40demo.test:arkham_fake_smtp_pass@mail:587}" # nosemgrep: deterministic demo decoy, not a credential
x-amqp-splice-port: &amqp-splice-port "5673"
x-amqp-splice-dir: &amqp-splice-dir "/out/amqp-splice"

services:
  certs:
    image: oven/bun:1
    entrypoint:
      [
        "bash",
        "-c",
        "apt-get update -qq && apt-get install -qq -y openssh-client && /srv/gen-certs.sh /certs && /srv/gen-secrets.sh /arkham-config",
      ]
    environment:
      ARKHAM_REAL: ${ARKHAM_REAL:?copy integration/.env.example to integration/.env}
      ARKHAM_DB_REAL: ${ARKHAM_DB_REAL:?copy integration/.env.example to integration/.env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?copy integration/.env.example to integration/.env}
      ARKHAM_REDIS_REAL: ${ARKHAM_REDIS_REAL:?copy integration/.env.example to integration/.env}
      ARKHAM_REDIS_TLS_REAL: ${ARKHAM_REDIS_TLS_REAL:?copy integration/.env.example to integration/.env}
      ARKHAM_SMTP_REAL: ${ARKHAM_SMTP_REAL:?copy integration/.env.example to integration/.env}
      ARKHAM_SMTPS_REAL: ${ARKHAM_SMTPS_REAL:?copy integration/.env.example to integration/.env}
      ARKHAM_LDAP_REAL: ${ARKHAM_LDAP_REAL:?copy integration/.env.example to integration/.env}
      ARKHAM_LDAP_TLS_REAL: ${ARKHAM_LDAP_TLS_REAL:?copy integration/.env.example to integration/.env}
      ARKHAM_NATS_REAL: ${ARKHAM_NATS_REAL:?copy integration/.env.example to integration/.env}
      ARKHAM_NATS_NKEY_REAL: ${ARKHAM_NATS_NKEY_REAL:?run integration/gen-nats.sh}
      ARKHAM_NATS_JWT_REAL: ${ARKHAM_NATS_JWT_REAL:?run integration/gen-nats.sh}
      ARKHAM_AMQP_REAL: ${ARKHAM_AMQP_REAL:?copy integration/.env.example to integration/.env}
      ARKHAM_AMQP_TLS_REAL: ${ARKHAM_AMQP_TLS_REAL:?copy integration/.env.example to integration/.env}
    volumes:
      - ./gen-certs.sh:/srv/gen-certs.sh:ro
      - ./gen-secrets.sh:/srv/gen-secrets.sh:ro
      - certs:/certs
      - arkham-config:/arkham-config
    restart: "no"

  arkham:
    build:
      context: ./docker
      dockerfile: ../../Dockerfile
    command:
      [
        "serve",
        "--proxy-backend",
        "${ARKHAM_BACKEND:-tproxy}",
        "--config",
        "/etc/arkham/arkham.toml",
      ]
    environment:
      RUST_LOG: debug
      # The guest leg's host key and arkham's own upstream known_hosts
      # (accept-new): both live in the certs volume gen-certs.sh seeded.
      ARKHAM_SSH_HOST_KEY: /certs/ssh/arkham_host
      ARKHAM_SSH_KNOWN_HOSTS: /var/lib/arkham/ssh_known_hosts
      # The mounted volume is the config dir: it holds the config anchor
      # plus fnox.toml, the secret source gen-secrets.sh rendered from the
      # environment. No committed file carries a real value.
      ARKHAM_CONFIG: /arkham-config/config.toml
    stop_grace_period: 1s
    cap_add:
      - NET_ADMIN
    # The tun backend opens the host TUN device; harmless for the others.
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./out/arkham.toml:/etc/arkham/arkham.toml:ro
      - certs:/certs:ro
      - arkham-config:/arkham-config:ro
      # Discovered NATS grant blobs (CA). Empty unless test:ssh ran arkham init.
      - ./out/nats-discovery/grants:/arkham/grants:ro
    networks:
      default: {}
      server:
        ipv4_address: 10.202.0.10
    depends_on:
      certs:
        condition: service_completed_successfully

  api:
    image: oven/bun:1
    working_dir: /srv
    command: ["run", "server.ts"]
    environment:
      ARKHAM_REAL: ${ARKHAM_REAL:?copy integration/.env.example to integration/.env}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?copy integration/.env.example to integration/.env}
      OIDC_ACCESS_TOKEN: ${OIDC_ACCESS_TOKEN:?copy integration/.env.example to integration/.env}
    volumes:
      - ./api:/srv:ro
      - certs:/certs:ro
    networks:
      server:
        ipv4_address: 10.202.0.20
    depends_on:
      certs:
        condition: service_completed_successfully

  db:
    image: postgres:17-alpine
    # The image default is scram-sha-256, so this leg exercises SCRAM.
    # The key is copied out of the shared volume and re-owned: postgres
    # refuses a private key it does not own, and the volume file is root-owned.
    command:
      - sh
      - -c
      - cp /certs/pg.key /tmp/pg.key && chown postgres:postgres /tmp/pg.key && chmod 600 /tmp/pg.key && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/certs/pg.crt -c ssl_key_file=/tmp/pg.key
    environment:
      POSTGRES_USER: arkham
      POSTGRES_PASSWORD: arkham_real_password_01
      POSTGRES_DB: demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkham -d demo"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - certs:/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully
    networks:
      server:
        ipv4_address: 10.202.0.30

  # A plain openssh-server. It admits exactly the real identity's public
  # half; the decoy never authenticates here. arkham dials it on the server
  # net, and its host key rides accept-new into arkham's known_hosts.
  sshd:
    image: alpine:3.22
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "apk add --no-cache openssh-server && ssh-keygen -A && adduser -D -s /bin/sh agent && sed -i '/^agent:/s/!/*/' /etc/shadow && mkdir -p /home/agent/.ssh && cp /certs/ssh/authorized_keys /home/agent/.ssh/authorized_keys && chown -R agent:agent /home/agent/.ssh && exec /usr/sbin/sshd -D -e -o Port=22 -o ListenAddress=0.0.0.0 -o PermitRootLogin=no -o PasswordAuthentication=no -o PubkeyAuthentication=yes -o StrictModes=no -o UsePAM=no -o AuthorizedKeysFile=.ssh/authorized_keys -o LogLevel=VERBOSE",
      ]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    volumes:
      - certs:/certs:ro
    networks:
      server:
        ipv4_address: 10.202.0.40
    depends_on:
      certs:
        condition: service_completed_successfully

  # Official Redis 7 server with requirepass plus ACL user; listens on both
  # plaintext (6379) and TLS (6380). TLS uses a CA-signed leaf; ACL admits
  # one username+password pair. arkham captures the client's connection,
  # swaps credentials, and tests AUTH/HELLO plus pipelining over both legs.
  redis:
    image: redis:7-alpine
    command:
      - sh
      - -c
      - |
        cp /certs/redis.key /tmp/redis.key && chmod 600 /tmp/redis.key && chown redis:redis /tmp/redis.key
        cat > /tmp/redis.conf <<'EOF'
        requirepass arkham_real_redis_pass
        user arkham_user on >arkham_real_redis_pass ~* &* +@all
        port 6379
        tls-port 6380
        tls-cert-file /certs/redis.crt
        tls-key-file /tmp/redis.key
        tls-ca-cert-file /certs/ca.crt
        # A CA file makes Redis require a client certificate. This demo
        # authenticates with AUTH passwords, and the proxy has no client cert,
        # so Redis was closing the upstream leg (peer did not return a certificate).
        tls-auth-clients no
        EOF
        exec redis-server /tmp/redis.conf
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a arkham_real_redis_pass PING"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - certs:/certs:ro
    networks:
      server:
        ipv4_address: 10.202.0.50
    depends_on:
      certs:
        condition: service_completed_successfully

  # Official docker-mailserver. SMTP_ONLY stays unset: Dovecot is what
  # answers SASL AUTH. The heavy scanners stay off so startup is the
  # mail stack, not clamav. STARTTLS is required on 587 (the image
  # default); 465 is implicit TLS. The account is added before
  # supervisord, so Dovecot's user database includes it at first start.
  mail:
    image: mailserver/docker-mailserver@sha256:d0fe7668defe157aad57ea31b1707ad1e2fb57d7a91bdf17cbdf876549946c86
    hostname: mail.demo.test
    command: ["/bin/bash", "/tmp/docker-mailserver/add-account.sh"]
    environment:
      SSL_TYPE: manual
      SSL_CERT_PATH: /certs/mail.crt
      SSL_KEY_PATH: /certs/mail.key
      PERMIT_DOCKER: connected-networks
      POSTMASTER_ADDRESS: postmaster@demo.test
      OVERRIDE_HOSTNAME: mail.demo.test
      ENABLE_RSPAMD: 0
      ENABLE_CLAMAV: 0
      ENABLE_AMAVIS: 0
      ENABLE_FAIL2BAN: 0
      ENABLE_SPAMASSASSIN: 0
      ENABLE_OPENDKIM: 0
      ENABLE_OPENDMARC: 0
      ENABLE_POLICYD_SPF: 0
      ENABLE_SRS: 0
      ENABLE_UPDATE_CHECK: 0
      ARKHAM_SMTP_PASS: ${ARKHAM_SMTP_PASS:?copy integration/.env.example to integration/.env}
    volumes:
      - certs:/certs:ro
      - ./mail/add-account.sh:/tmp/docker-mailserver/add-account.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "setup email list | grep -q agent@demo.test && timeout 5 bash -c 'echo >/dev/tcp/127.0.0.1/587' && timeout 5 bash -c 'echo >/dev/tcp/127.0.0.1/465'",
        ]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 20s
    networks:
      server:
        ipv4_address: 10.202.0.60
    depends_on:
      certs:
        condition: service_completed_successfully

  # 389 Directory Server. The manifest list was last pushed June 2025 and
  # carries amd64 and arm64. Cleartext is 3389, LDAPS is 3636. The entry
  # copies the demo-CA leaf into /data/tls before the first start so the
  # container imports it, then turns on nsslapd-require-secure-binds.
  # That flag demands a protected bind. It does not demand a client
  # certificate, and this demo does not present one.
  ldap:
    image: quay.io/389ds/dirsrv@sha256:f2851654c5df545cd893d84bea8d08c28dc25f0930493fbfed1d8a6eacf657f7
    environment:
      DS_DM_PASSWORD: arkham_real_ldap_pass_01
      DS_SUFFIX_NAME: dc=example,dc=com
      DS_STARTUP_TIMEOUT: "180"
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        mkdir -p /data/tls/ca
        cp /certs/ldap.key /data/tls/server.key
        cp /certs/ldap.crt /data/tls/server.crt
        cp /certs/ca.crt /data/tls/ca/ca.crt
        chmod 600 /data/tls/server.key
        # `dscontainer -H` succeeds as soon as LDAPI accepts a connection,
        # which is during instance creation. Running dsconf then resets
        # that connection and the installer exits. The started line is
        # printed only after creation and the Directory Manager password.
        /usr/libexec/dirsrv/dscontainer -r > /tmp/dscontainer.log 2>&1 &
        child=$$!
        tail -n +1 -f /tmp/dscontainer.log &
        logpid=$$!
        trap 'kill "$$child" "$$logpid" 2>/dev/null || true; wait "$$child" || true' TERM INT
        ready=0
        for _ in $$(seq 1 180); do
          if grep -q "389-ds-container started" /tmp/dscontainer.log; then
            ready=1
            break
          fi
          if ! kill -0 "$$child" 2>/dev/null; then
            wait "$$child" || true
            exit 1
          fi
          sleep 2
        done
        if [ "$$ready" != 1 ]; then
          echo "ldap did not become ready" >&2
          exit 1
        fi
        dsconf localhost config replace nsslapd-require-secure-binds=on
        # The decoy itself is not a directory credential. These binds stay
        # inside the container, so the proxy cannot rewrite them. Result 49
        # is invalid credentials. A different password would not prove this.
        set +e
        LDAPTLS_REQCERT=never ldapsearch -H ldaps://127.0.0.1:3636 -x -D "cn=Directory Manager" -w "arkham_fake_ldap_pass" -b "" -s base >/dev/null 2>&1 # nosemgrep: deterministic demo decoy, not a credential
        ldaps_code=$$?
        LDAPTLS_REQCERT=never ldapsearch -H ldap://127.0.0.1:3389 -ZZ -x -D "cn=Directory Manager" -w "arkham_fake_ldap_pass" -b "" -s base >/dev/null 2>&1 # nosemgrep: deterministic demo decoy, not a credential
        starttls_code=$$?
        set -e
        if [ "$$ldaps_code" != 49 ]; then
          echo "ldaps decoy bind returned $$ldaps_code" >&2
          exit 1
        fi
        if [ "$$starttls_code" != 49 ]; then
          echo "starttls decoy bind returned $$starttls_code" >&2
          exit 1
        fi
        wait "$$child"
    healthcheck:
      test: ["CMD-SHELL", "dsconf localhost config get nsslapd-require-secure-binds | grep -q 'nsslapd-require-secure-binds: on'"]
      interval: 5s
      timeout: 15s
      retries: 40
      start_period: 180s
    volumes:
      - certs:/certs:ro
    networks:
      server:
        ipv4_address: 10.202.0.80
    depends_on:
      certs:
        condition: service_completed_successfully

  # Official NATS server. TLS is required on 4222: the server writes one
  # cleartext INFO line, then expects a handshake. gen-nats.sh writes the
  # config: the password user for scenarios 17 and 18, plus the real user
  # nkey. The tls block sets no `verify`, so the server does not ask for a
  # client certificate; the proxy's upstream leg has none. `no_advertise`
  # keeps cluster client URLs out of INFO, so the client never learns an
  # address it did not dial.
  nats:
    image: nats:2.15.1-alpine
    command: ["nats-server", "-c", "/etc/nats/server.conf"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - certs:/certs:ro
      - ./out/nats/server.conf:/etc/nats/server.conf:ro
    networks:
      server:
        ipv4_address: 10.202.0.90
    depends_on:
      certs:
        condition: service_completed_successfully

  # Operator mode cannot share the authorization-users server. The account
  # JWT is preloaded so the server checks the user JWT. gen-nats.sh writes
  # the config. The same leaf covers DNS:nats-jwt. Port 4223 is its own
  # shortlist: transparent capture picks the NATS grant by destination port
  # before the guest sends SNI, and the password grant on 4222 would
  # otherwise become the authority.
  nats-jwt:
    image: nats:2.15.1-alpine
    command: ["nats-server", "-c", "/etc/nats/jwt.conf"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - certs:/certs:ro
      - ./out/nats/jwt.conf:/etc/nats/jwt.conf:ro
      - ./out/nats/operator.jwt:/etc/nats/operator.jwt:ro
    networks:
      server:
        ipv4_address: 10.202.0.91
    depends_on:
      certs:
        condition: service_completed_successfully

  # Official RabbitMQ 4.3.6 (Alpine), pinned by its manifest-list digest.
  # The broker's one user is `svc` with the real password; `default_user`
  # replaces the image's `guest`. 5672 is cleartext and 5671 is TLS with
  # the demo-CA leaf. AMQP 1.0 is a core protocol in 4.x, and
  # `rabbitmq_amqp1_0` is the no-op plugin 4.x keeps so deployment tools
  # can still enable it. TLS does not ask for a client certificate: the
  # demo authenticates with passwords. The key is copied and re-owned
  # because the volume file is root-owned and the broker runs as rabbitmq.
  # 10.202.0.100, because NATS already owns 10.202.0.90.
  amqp:
    image: rabbitmq:4.3.6-alpine@sha256:60f9d5575c0a96f0df221fa55a9bd82118c0098f006ff08f7c8b797ef7fd0f50
    command:
      - sh
      - -c
      - |
        set -eu
        cp /certs/amqp.key /tmp/amqp.key && chown rabbitmq:rabbitmq /tmp/amqp.key && chmod 600 /tmp/amqp.key
        cat > /etc/rabbitmq/conf.d/90-arkham.conf <<'EOF'
        default_user = svc
        default_pass = arkham_real_amqp_pass_longer_01
        listeners.tcp.default = 5672
        listeners.tcp.ungranted = 5673
        listeners.ssl.default = 5671
        ssl_options.certfile = /certs/amqp.crt
        ssl_options.keyfile = /tmp/amqp.key
        ssl_options.verify = verify_none
        ssl_options.fail_if_no_peer_cert = false
        EOF
        su-exec rabbitmq rabbitmq-plugins enable --offline rabbitmq_amqp1_0
        exec docker-entrypoint.sh rabbitmq-server
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rabbitmq-diagnostics -q check_port_connectivity && rabbitmqctl -q authenticate_user svc arkham_real_amqp_pass_longer_01 >/dev/null && ! rabbitmqctl -q authenticate_user svc arkham_fake_amqp_pass >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 15s
      retries: 30
      start_period: 15s
    volumes:
      - certs:/certs:ro
    networks:
      server:
        ipv4_address: 10.202.0.100
    depends_on:
      certs:
        condition: service_completed_successfully

  amqp-witness:
    build:
      context: ./docker/amqp-witness
    command: ["python3", "/witness/amqp-witness.py"]
    environment:
      AMQP_SPLICE_PORT: *amqp-splice-port
      AMQP_SPLICE_DIR: *amqp-splice-dir
      HOST_UID: ${HOST_UID:-}
      HOST_GID: ${HOST_GID:-}
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - CHOWN
      # The results bind mount is owned by the host user, so root cannot create the splice directory without this.
      - DAC_OVERRIDE
    volumes:
      - ./docker/amqp-witness:/witness:ro
      - ./out/results:/out
    network_mode: service:amqp
    depends_on:
      amqp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f \"$$AMQP_SPLICE_DIR/ready\" && command -v tcpflow >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 40s

  # Decoy AUTH straight at the mail server, from a network namespace the
  # capture rules do not cover. Not the client: that container is the
  # confined agent and must not hold NET_ADMIN. An empty SMTP_URL skips
  # the dial so the client still reaches run.ts.
  smtp-direct:
    image: python:3-slim@sha256:db3231d3fce4c59182f8364dbec08b8bad4fdfca673dfb226f3c9e77b6b48cd2
    working_dir: /srv
    # The image entrypoint is python3. Replace it so the shell is the process.
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -euo pipefail
        rm -f /out/smtp-direct.txt
        if [ -z "$${SMTP_URL:-}" ]; then
          echo "smtp direct skipped: no SMTP_URL"
          exit 0
        fi
        ok=0
        for _ in 1 2 3 4 5; do
          if python3 /srv/smtp.py direct | tee /out/smtp-direct.txt; then
            ok=1
            break
          fi
          sleep 2
        done
        test "$$ok" = 1
        if [ -n "$${HOST_UID:-}" ] && [ "$$HOST_UID" != 0 ]; then
          gid="$${HOST_GID:-$$HOST_UID}"
          chown "$$HOST_UID:$$gid" /out/smtp-direct.txt /out
        fi
    environment:
      SMTP_URL: *smtp-url
      HOST_UID: ${HOST_UID:-}
      HOST_GID: ${HOST_GID:-}
    volumes:
      - ./client:/srv:ro
      - certs:/certs:ro
      - ./out/results:/out
    networks:
      server:
        ipv4_address: 10.202.0.70
    depends_on:
      certs:
        condition: service_completed_successfully
      mail:
        condition: service_healthy
    restart: "no"

  client:
    image: oven/bun:1
    working_dir: /srv
    # openssh-client first: scenario 8 is a plain `ssh` binary holding only
    # the decoy identity, connecting through the transparent capture.
    # apt needs root. When the host passes HOST_UID, bun then drops to that
    # user so the bind-mounted coverage file is not owned by root.
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -qq -y openssh-client python3 iproute2 ca-certificates curl unzip
        cp /certs/ca.crt /usr/local/share/ca-certificates/arkham-demo.crt
        update-ca-certificates
        arch=$$(uname -m)
        case "$$arch" in
          x86_64) nats_arch=amd64; nats_sum=d9fc93e9e9ab0310deff7e719a8a0da6f9d66f26d473f039aaee70155507aecc ;;
          aarch64|arm64) nats_arch=arm64; nats_sum=39496b0e332ba8d1b7dcbac2019c7d1e7a7f0d0ccefef9da547e9d6eeed408c8 ;;
          *) echo "unsupported arch $$arch"; exit 1 ;;
        esac
        curl -fsSL -o /tmp/natscli.zip "https://github.com/nats-io/natscli/releases/download/v0.5.0/nats-0.5.0-linux-$${nats_arch}.zip"
        echo "$${nats_sum}  /tmp/natscli.zip" | sha256sum -c -
        unzip -p /tmp/natscli.zip "nats-0.5.0-linux-$${nats_arch}/nats" > /usr/local/bin/nats
        chmod 755 /usr/local/bin/nats
        rm -f /tmp/natscli.zip
        mkdir -p /opt/client
        cp /srv/package.json /srv/run.ts /opt/client/
        (cd /opt/client && bun install)
        chmod -R a+rX /opt/client
        if [ -f /opt/nats-discovered/context.txt ]; then
          mkdir -p /tmp/.config/nats
          cp -a /opt/nats-discovered/. /tmp/.config/nats/
          if [ -n "$${HOST_UID:-}" ] && [ "$$HOST_UID" != 0 ]; then
            gid="$${HOST_GID:-$$HOST_UID}"
            chown -R "$$HOST_UID:$$gid" /tmp/.config/nats
          fi
        fi
        if [ -n "$${HOST_UID:-}" ] && [ "$$HOST_UID" != 0 ]; then
          gid="$${HOST_GID:-$$HOST_UID}"
          mkdir -p /out
          chown "$$HOST_UID:$$gid" /out
          # ssh ignores a private key it does not own, and it refuses a uid
          # with no passwd entry. /certs is read-only, so the decoy is copied.
          # $$ keeps these as shell variables; compose would otherwise interpolate them.
          if ! getent group "$$gid" >/dev/null; then
            echo "arkham:x:$$gid:" >> /etc/group
          fi
          if ! getent passwd "$$HOST_UID" >/dev/null; then
            echo "arkham:x:$$HOST_UID:$$gid:arkham:/tmp:/bin/bash" >> /etc/passwd
          fi
