# The secret source for the demo's database rule: fnox's own config syntax,
# discovered at <config-dir>/fnox.toml. The real connection string — arkham's
# northbound dial target, carrying the real password — lives here, never in
# arkham.toml. The `plain` provider serves a deterministic demo fixture
# without any secret manager.
[providers.plain]
type = "plain"

[secrets.DATABASE_URL]
provider = "plain"
value = "postgres://arkham:arkham_real_password_01@db:5432/demo?sslmode=require"

[secrets.REDIS_URL]
provider = "plain"
value = "redis://arkham_user:arkham_real_redis_pass@redis:6379/0"

# `sslrootcert` is arkham's upstream trust anchor. It is parsed off the
# string before the dial; Redis itself never sees the query.
[secrets.REDIS_TLS_URL]
provider = "plain"
value = "rediss://arkham_user:arkham_real_redis_pass@redis:6380/0?sslrootcert=/certs/ca.crt"

# `starttls=required` withholds the password until STARTTLS completes.
# `sslrootcert` is parsed off the string before the dial.
[secrets.SMTP_URL]
provider = "plain"
value = "smtp://agent%40demo.test:arkham_real_smtp_pass@mail:587?starttls=required&sslrootcert=/certs/ca.crt"

[secrets.SMTPS_URL]
provider = "plain"
value = "smtps://agent%40demo.test:arkham_real_smtp_pass@mail:465?sslrootcert=/certs/ca.crt"

# `sslrootcert` is arkham's upstream trust anchor. ldap:// uses it after
# StartTLS; ldaps:// uses it on connect. The directory never sees the query.
[secrets.LDAP_URL]
provider = "plain"
value = "ldap://cn%3DDirectory%20Manager:arkham_real_ldap_pass_01@ldap:3389?sslrootcert=/certs/ca.crt"

[secrets.LDAP_TLS_URL]
provider = "plain"
value = "ldaps://cn%3DDirectory%20Manager:arkham_real_ldap_pass_01@ldap:3636?sslrootcert=/certs/ca.crt"

# `tls://` upgrades the upstream leg after INFO; the CONNECT password is
# swapped only on that leg. `sslrootcert` is parsed off before the dial.
[secrets.NATS_URL]
provider = "plain"
value = "tls://agent:arkham_real_nats_pass@nats:4222?sslrootcert=/certs/ca.crt"

# The container copy of these two is rendered by gen-secrets.sh from
# ARKHAM_NATS_NKEY_REAL and ARKHAM_NATS_JWT_REAL. gen-nats.sh writes those
# variables into the gitignored .env. These lines show the string form.
[secrets.NATS_NKEY_URL]
provider = "plain"
value = "tls://nkey:SU_REAL_USER_SEED@nats:4222?sslrootcert=/certs/ca.crt"

[secrets.NATS_JWT_URL]
provider = "plain"
value = "tls://creds:SU_REAL_JWT_SEED:REAL_USER_JWT@nats-jwt:4223?sslrootcert=/certs/ca.crt"

[secrets.AMQP_URL]
provider = "plain"
value = "amqps://svc:arkham_real_amqp_pass_longer_01@amqp:5671?sslrootcert=/certs/ca.crt"

[secrets.AMQP_TLS_URL]
provider = "plain"
value = "amqps://svc:arkham_real_amqp_pass_longer_01@amqp:5671?sslrootcert=/certs/ca.crt"
