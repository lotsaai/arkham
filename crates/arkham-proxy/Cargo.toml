[package]
name = "arkham-proxy"
version = "0.3.31"
edition = "2024"
description = "grant-scoped MITM proxy: substitution machines and the relay core"
license = "Apache-2.0"
repository = "https://github.com/casualjim/arkham"
publish = false

[dependencies]
actson = { workspace = true }
amq-protocol = { workspace = true }
atoi = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
arkham-config = { workspace = true }
arkham-pki = { workspace = true }
arkham-plugin = { workspace = true }
arkham-smtp = { workspace = true }
arkham-wire = { workspace = true }
fe2o3-amqp-types = { workspace = true }
httlib-hpack = { workspace = true }
httparse = { workspace = true }
memchr = { workspace = true }
pgwire = { workspace = true, features = ["client-api-aws-lc-rs", "server-api-aws-lc-rs"] }
rama = { workspace = true, features = ["boring", "tcp"] }
rasn = { workspace = true }
rasn-ldap = { workspace = true }
russh = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
secrecy = { workspace = true }
serde_amqp = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
async-compat = { workspace = true }
async-nats = { workspace = true }
async-trait = { workspace = true }
fe2o3-amqp = { workspace = true }
futures = { workspace = true }
h2 = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
lapin = { workspace = true }
ldap3 = { workspace = true }
lettre = { workspace = true }
nkeys = { workspace = true }
# server-api-aws-lc-rs also turns on pgwire's TLS acceptor, which the
# handshake tests drive with a real rustls server.
pgwire = { workspace = true, features = ["server-api-aws-lc-rs"] }
pretty_assertions = { workspace = true }
proptest = { workspace = true }
redis = { workspace = true }
tempfile = { workspace = true }
tokio-postgres = { workspace = true }

[lints]
workspace = true
