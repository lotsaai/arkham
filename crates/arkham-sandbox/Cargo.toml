[package]
name = "arkham-sandbox"
version = "0.3.37"
edition = "2024"
description = "Linux confinement and process execution"
license = "Apache-2.0"
repository = "https://github.com/casualjim/arkham"
publish = false

[dependencies]
arkham-config = { workspace = true }
arkham-launch-plan = { workspace = true }
libc = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
