[package]
name = "arkham-ebpf-programs"
version = "0.3.26"
edition = "2024"
description = "grant-scoped MITM proxy: eBPF kernel-side programs"
license = "Apache-2.0"
repository = "https://github.com/casualjim/arkham"
publish = false

# A workspace member only so `aya-build` can resolve it with
# `cargo build --package`; it compiles for the `bpf` target alone, with nightly
# and `-Z build-std`, and every host-wide command excludes it.
# `dist = false` backs that up for cargo-dist: with `precise-builds` it is
# redundant, but it keeps dist from ever selecting this crate for a release.
[package.metadata.dist]
dist = false

[dependencies]
aya-ebpf = "0.2"

[[bin]]
name = "arkham-ebpf-programs"
path = "src/main.rs"

# Deliberately not inheriting `[workspace.lints]`: those lints are written for
# documented library code, while this target's public surface is generated by
# `aya-ebpf`'s attribute macros, which emit undocumented wrapper functions that
# no amount of source annotation can satisfy.
[lints]
