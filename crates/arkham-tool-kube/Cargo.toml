[package]
name = "arkham-tool-kube"
version = "0.3.39"
edition = "2024"
description = "Kubernetes configuration adaptation for arkham"
license = "Apache-2.0"
repository = "https://github.com/casualjim/arkham"
publish = false

[dependencies]
arkham-config = { workspace = true }
arkham-pki = { workspace = true }
arkham-tool-config = { workspace = true }
base64 = { workspace = true }
http = { workspace = true }
kube-client = { workspace = true }
secrecy = { workspace = true }
serde_yaml = { workspace = true }
k8s-openapi = { workspace = true }
thiserror = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
toml_edit = { workspace = true }
tracing-subscriber = { workspace = true, default-features = false, features = ["fmt"] }

[lints]
workspace = true
