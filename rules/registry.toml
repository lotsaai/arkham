# Crypto infrastructure beyond exchanges: market data, node/RPC providers,
# block explorers and indexers, custody, and DeFi protocols. Every host below
# is from the vendor's own documentation (linked per entry). Keys here travel
# in a header, a query parameter, or a URL path, so they substitute like any
# other value. A few vendors sign with the other half of the credential — an
# HMAC or JWT input that never reaches the wire — and those names, like the
