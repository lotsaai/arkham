pattern = "{base62:32}"
send = [{ header = "X-Ovh-Application" }, { header = "X-Ovh-Consumer" }]
# source: https://docs.ovhcloud.com/en/guides/manage-and-operate/api/first-steps.md
# source: https://github.com/ovh/python-ovh/blob/master/ovh/client.py
# note: the application key is the `X-Ovh-Application` header and the consumer key is the `X-Ovh-Consumer` header. Both are header credentials and substitute.
# note: the application secret is a SHA1 input and never reaches the wire — see providers.ovh-secret. The docs state no key format, so the shape is generic.

[providers.ovh-secret]
env = ["OVH_APPLICATION_SECRET", "OVH_APP_SECRET"]
signing = { scheme = "sha1", header = "X-Ovh-Signature" }
# `X-Ovh-Signature` is `$1$` + SHA1(application secret + "+" + consumer key + "+" + method + "+" + url + "+" + body + "+" + timestamp).
# The application secret is an algorithm input and never reaches the wire, so no hosts — decoy shape only, no rule.
# https://github.com/casualjim/arkham/issues/14 https://github.com/casualjim/arkham/issues/15

