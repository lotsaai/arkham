hosts = ["https://app.aikido.dev"]
pattern = "{base62:32}"
# source: betterleaks v1.6.1 rule `aikido-ci-token` — its validate expression calls app.aikido.dev
# note: the CI token rule states no literal prefix; the client secret gets its `AIK_SECRET_` shape in the alias block.

