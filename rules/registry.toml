# ---------------------------------------------------------------------------
# betterleaks (gitleaks successor) rule set: vendors the detectors above state
# no verification endpoint for. Hosts come from each rule's `validate`
# expression, which calls the vendor's own API; a rule whose regex states a
# literal prefix gets that prefix in its pattern.
# Credentials that are only ever used to sign a request (AWS SigV4, Alibaba Cloud,
# OVH application secrets, Exoscale) are split: the public API key half (which
# appears in headers) keeps hosts and substitutes, while the secret signing half
# lives in a hostless `<provider>-secret` entry with no rule — decoy shape only.
# See https://github.com/casualjim/arkham/issues/14 and https://github.com/casualjim/arkham/issues/19.
# source: github.com/betterleaks/betterleaks v1.6.1 config/betterleaks.toml
# ---------------------------------------------------------------------------

