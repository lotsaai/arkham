hosts = ["https://api.kucoin.com", "https://api-broker.kucoin.com", "https://api-futures.kucoin.com", "https://kucoin.com"]
pattern = "{base62:32}"
send = [{ header = "KC-API-KEY" }, { header = "KC-API-PASSPHRASE" }]
# source: https://github.com/trufflesecurity/trufflehog/blob/main/pkg/detectors/kucoin/kucoin.go
# source: https://www.kucoin.com/docs-new/authentication
# note: the key is the `KC-API-KEY` header. Key version 1 sends the passphrase in `KC-API-PASSPHRASE` as plaintext, so that name stays in scope. Version 2 sends Base64 HMAC-SHA256(secret, passphrase) instead, and a raw swap of the passphrase misses it.
# note: `KC-API-SIGN` is Base64 HMAC-SHA256 of the secret over timestamp + method + endpoint + body and is not the secret — see providers.kucoin-secret.

