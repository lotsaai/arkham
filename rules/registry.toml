[providers.akeyless]
env = ["AKEYLESS_API_KEY"]
hosts = ["https://vault.akeyless.io"]
pattern = "{base62:32}"
# source: https://docs.akeyless.io/docs/secret-retrieval-k8s-quickstart
# source: https://docs.akeyless.io/docs/cli
# note: `AKEYLESS_API_KEY` is documented as the Kubernetes Secrets Injector's Helm-chart env (with `AKEYLESS_ACCESS_ID`/`AKEYLESS_ACCESS_TYPE`); no shell-level token env is documented.
# note: `https://vault.akeyless.io` is the documented US SaaS endpoint example; `AKEYLESS_URL`/`AKEYLESS_GATEWAY_URL` point to a per-deployment Gateway, so self-hosted gateways need explicit allow entries.
# note: the Access Key format and length are not stated in the docs; the pattern is the default shape.

[providers.aki-io]
env = ["AKI_IO_API_KEY"]
hosts = ["https://aki.io"]
pattern = "{base62:32}"
# source: https://models.dev/api.json (curated provider catalog)
# note: no vendor page states a key format; the shape is generic.

[providers.alibaba]
env = ["ALIBABA_API_KEY", "DASHSCOPE_API_KEY"]
hosts = ["https://dashscope.aliyuncs.com", "https://dashscope-intl.aliyuncs.com", "https://*.maas.aliyuncs.com"]
pattern = "sk-{base62:32}"
# source: https://www.alibabacloud.com/help/en/model-studio/first-api-call-to-qwen
# source: https://www.alibabacloud.com/help/en/model-studio/compatibility-of-openai-with-dashscope
# note: Model Studio (Qwen/DashScope) documents `export DASHSCOPE_API_KEY`; the OpenAI-compatible base URLs are `https://dashscope.aliyuncs.com/compatible-mode/v1` (China) and `https://dashscope-intl.aliyuncs.com/compatible-mode/v1` (international).
# note: `ALIBABA_API_KEY` is the generic name; paired with a custom `ALIBABA_API_BASE_URL` it points at a self-hosted or private endpoint, so add that host in rules.d.
# note: every workspace-scoped Model Studio base URL is a per-region `{WorkspaceId}...maas.aliyuncs.com` host, so the wildcard covers that host family.
# note: the key examples render as `sk-xxx`/`sk-ee166797fe40xxx`; the body length is not stated, so the pattern approximates it.
# note: Singapore, US (Virginia), and China (Beijing) API keys are not interchangeable.
# note: RAM AccessKey pairs are a different credential — see providers.alibaba-cloud.

[providers.alibaba-cloud]
env = ["ALIBABA_CLOUD_ACCESS_KEY_ID", "ALICLOUD_ACCESS_KEY_ID", "ALICLOUD_ACCESS_KEY"]
hosts = ["https://*.aliyuncs.com"]
pattern = "{base62:32}"
send = { header = "Authorization" }
# source: https://www.alibabacloud.com/help/en/sdk/product-overview/v3-request-structure-and-signature
# note: the AccessKey id is the `Credential` value in `Authorization: ACS3-HMAC-SHA256 Credential=...,SignedHeaders=...,Signature=...`.
# note: official SDKs read `ALIBABA_CLOUD_ACCESS_KEY_ID`; the Terraform alicloud provider reads `ALICLOUD_ACCESS_KEY`. The signature docs state no key format, so the shape is generic.
# note: the AccessKey secret is the ACS3-HMAC-SHA256 key and never reaches the wire — see providers.alibaba-cloud-secret. The STS security token is sent and stays in scope — see providers.alibaba-cloud-sts.

[providers.alibaba-cloud-sts]
env = ["ALIBABA_CLOUD_SECURITY_TOKEN", "ALICLOUD_SECURITY_TOKEN"]
hosts = ["https://*.aliyuncs.com"]
pattern = "{base62:32}"
send = { header = "x-acs-security-token" }
# source: https://www.alibabacloud.com/help/en/sdk/product-overview/v3-request-structure-and-signature
# note: temporary credentials send the STS token in the `x-acs-security-token` header. It is an ordinary header credential, so it substitutes. The temporary AccessKey secret that accompanies it does not — see providers.alibaba-cloud-secret.

[providers.alibaba-cloud-secret]
env = ["ALIBABA_CLOUD_ACCESS_KEY_SECRET", "ALICLOUD_ACCESS_KEY_SECRET", "ALICLOUD_SECRET_KEY"]
signing = { scheme = ["hmac-sha256", "hmac-sha1"], header = "Authorization" }
# ACS3-HMAC-SHA256 (older signature versions use HMAC-SHA1) takes the AccessKey secret as the HMAC key.
# The secret is an algorithm input and never reaches the wire, so no hosts — decoy shape only, no rule.
# https://github.com/casualjim/arkham/issues/14 https://github.com/casualjim/arkham/issues/15

