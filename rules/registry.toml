# source: https://support.airtable.com/docs/creating-personal-access-tokens
# source: https://support.airtable.com/docs/getting-started-with-airtables-web-api
# note: no cited page documents the `AIRTABLE_API_KEY` name; the Web API authenticates with `Authorization: Bearer` PATs.
# note: the docs state no token format; the pattern approximates the `pat`-prefixed, dot-separated token shape.

[providers.aixy]
