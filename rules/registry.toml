[providers.aws]
env = ["AWS_ACCESS_KEY_ID"]
hosts = ["https://*.amazonaws.com"]
pattern = "AKIA{base62:16}"
send = { header = "Authorization" }
# source: https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-envvars.html
# source: https://docs.aws.amazon.com/general/latest/gr/rande.html
# note: the `AKIA` prefix comes from the docs' `AKIAIOSFODNN7EXAMPLE`; real key ids are uppercase, which `{base62:N}` approximates.
# note: AWS_ACCESS_KEY_ID appears in the Authorization header and substitutes; AWS_SECRET_ACCESS_KEY is a SigV4 HMAC signing input and never reaches the wire — see providers.aws-secret.

[providers.aws-secret]
env = ["AWS_SECRET_ACCESS_KEY"]
signing = { scheme = "aws4-hmac-sha256", header = "Authorization" }
# signing half: a SigV4 HMAC input that never reaches the wire,
# so no hosts — decoy shape only, no rule. https://github.com/casualjim/arkham/issues/14

