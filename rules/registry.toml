# ---------------------------------------------------------------------------
# Crypto and exchange APIs. Exchanges come from CCXT, which lists each venue's
# own API hosts. The key half of a credential travels in the clear
# (`X-MBX-APIKEY`, `OK-ACCESS-KEY`, `API-Key`, ...), so it substitutes like any
# other value. The signing half is an HMAC input that never reaches the wire:
# each venue's secret names live in a hostless `<venue>-secret` entry, which
# gives the agent a shape-valid decoy without creating a rule that can never
# fire. `arkham rules` lists them commented. See
# https://github.com/casualjim/arkham/issues/19.
# Key formats are vendor-specific and mostly undocumented; patterns are generic
# unless a rule or a vendor page states one.
# source: ccxt 4.5.78 — each exchange's `urls.api` map
# ---------------------------------------------------------------------------


