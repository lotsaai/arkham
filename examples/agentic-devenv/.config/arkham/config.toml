# Workspace settings and rules. Real values resolve from fnox in the daemon,
# so no secret belongs in this file.

[workspace]
shell = "bash"

# Both env names are registry-known (anthropic, github), so the registry
# supplies each rule's hosts and decoy shape: `env` alone is a complete rule.
# `if_missing = "warn"` permits a session when fnox does not declare
# the key; `arkham rules` prints these blocks for whatever fnox does declare.

[rules.anthropic]
env = "ANTHROPIC_API_KEY"
if_missing = "warn"

[rules.github]
env = "GH_TOKEN"
if_missing = "warn"
