
[package]
name = "arkham"
version = "0.3.26"
edition = "2024"
description = "Secure your coding agent: decoy credentials that work, real secrets swapped in only on granted hosts"
license = "Apache-2.0"
repository = "https://github.com/casualjim/arkham"
keywords = ["agents", "secrets", "mitm", "proxy", "tls"]
categories = ["network-programming", "command-line-utilities"]

[package.metadata.dist]
# arkham is a single static-friendly binary; container + tarballs ship from CI.

[package.metadata.release]
sign-commit = false
sign-tag = false
publish = false
allow-branch = ["main"]
pre-release-commit-message = "chore: Release {{crate_name}} version {{version}}"
[workspace]
members = ["crates/*"]
exclude = ["examples/plugins"]
# `arkham-ebpf-programs` is a member (so `aya-build` can resolve it with
# `cargo build --package`) but never part of a host build: it only compiles for
# the `bpf` target with nightly and `-Z build-std`, so every workspace-wide
# command excludes it — see `hk.pkl` and `.mise/tasks/test/rust`.
resolver = "3"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
cargo = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
clone_on_ref_ptr = "warn"
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
float_cmp = "allow"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
implicit_clone = "warn"
literal_string_with_formatting_args = "allow"
map_err_ignore = "warn"
multiple_crate_versions = "allow"
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

[workspace.dependencies]
arkham-compose = { path = "crates/arkham-compose" }
arkham-config = { path = "crates/arkham-config" }
arkham-ebpf = { path = "crates/arkham-ebpf" }
arkham-fnox = { path = "crates/arkham-fnox" }
arkham-pki = { path = "crates/arkham-pki" }
arkham-plugin = { path = "crates/arkham-plugin" }
arkham-proxy = { path = "crates/arkham-proxy" }
arkham-tproxy = { path = "crates/arkham-tproxy" }
arkham-tun = { path = "crates/arkham-tun" }

# One declaration per external dependency so versions cannot drift between
# crates. rama tracks main deliberately: its 0.5 line is unpublished.
actson = "2.1.0"
amq-protocol = { version = "10.6.3", default-features = false }
async-trait = "0.1"
atoi = "2"
aya = "0.14"
aya-build = "0.2"
aya-obj = "0.3"
base62 = "2.0"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
code-workspace = "0.1.4"
confique = { version = "0.4", features = ["toml"] }
dashmap = "6"
dirs = "6"
eyre = "0.6"
fe2o3-amqp-types = "0.18.0"
fnox-core = "1.33"
futures = "0.3"
futures-sink = "0.3"
futures-util = "0.3.34"
gix-config = { version = "0.61", features = ["sha1"] }
gix-discover = { version = "0.56", features = ["sha1"] }
h2 = "0.4"
hex = "0.4"
httlib-hpack = "0.1.3"
http-body-util = "0.1"
httparse = "1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jwt = "0.16"
# crates.io 4.2.0 pulls serde-saphyr 0.0.29, which caps smallvec below 1.16.
# rama-utils requires smallvec ^1.16, so that release does not resolve.
# This rev is still package version 4.2.0 and moves serde-saphyr to 1.x
# (kube-rs#2086). Switch to the crates.io release once it includes that change.
kube-client = { git = "https://github.com/kube-rs/kube", rev = "1be7f0d96c3b211680b173c1fc83aa6ad4adba34", default-features = false, features = ["config"] }
lettre = { version = "0.11.23", default-features = false, features = ["aws-lc-rs", "smtp-transport", "tokio1", "tokio1-rustls", "webpki-roots"] }
libc = "0.2"
memchr = "2"
miette = { version = "7", features = ["fancy"] }
mimalloc = "0.1"
netlink-packet-core = "0.9"
netlink-packet-netfilter = "0.4"
netlink-sys = "0.8"
nkeys = "0.4.5"
percent-encoding = "2.3"
pgwire = { version = "0.41", default-features = false }
pretty_assertions = "1"
proptest = "1"
rama = { git = "https://github.com/plabayo/rama", branch = "main", default-features = false }
rand = "0.8"
rasn = { version = "0.29.0", default-features = false, features = ["std"] }
rasn-ldap = "0.29.0"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp"] }
regex = "1"
rtnetlink = "0.23.0"
russh = { version = "0.56", default-features = false, features = ["aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_amqp = "0.18.0"
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
shellexpand = "3"
smoltcp = { version = "0.14", default-features = false, features = ["alloc", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-dns", "socket-icmp", "socket-tcp", "socket-udp", "std"] }
smtp-proto = "0.2.5"
socket2 = "0.6"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "parking_lot", "rt", "rt-multi-thread", "sync", "time"] }
tokio-postgres = "0.7"
tokio-rustls = "0.26"
tokio-util = "0.7"
toml = "0.8"
toml_edit = { version = "0.25", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tun = { version = "0.7", features = ["async"] }
url = "2"
validator = { version = "0.20", features = ["derive"] }
wasmtime = { version = "48", default-features = false, features = ["async", "component-model", "cranelift", "parallel-compilation", "runtime", "std"] }
wasmtime-wasi = "48"
xpanda = "0.2"

[dependencies]
arkham-compose = { workspace = true }
arkham-config = { workspace = true }
arkham-fnox = { workspace = true }
arkham-pki = { workspace = true }
arkham-proxy = { workspace = true }
clap = { workspace = true }
confique = { workspace = true }
dirs = { workspace = true }
eyre = { workspace = true }
libc = { workspace = true }
miette = { workspace = true }
mimalloc = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
arkham-ebpf = { workspace = true }
arkham-tproxy = { workspace = true }
arkham-tun = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
